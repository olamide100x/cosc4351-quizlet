ed the Client's needs might have changed.", "a": "True"}, {"q": "In OPEN SOURCE SDLC projects is the of not attracting a team to work on the project real?", "a": "True"}, {"q": "Is there an error in this HTML Unordered list tags?\n<ul> <li> Apples<\/li> <li> Oranges<\/li> <\/ul>", "a": "Error : The line is missing a closing <\/li> tag. Omitting a closing <\/li> tag is a common error."}, {"q": "Is the UML USE CASE MODEL a Requirements Workflow MODEL?\nTrue\nFalse", "a": "TRUE \nRequirements Workflow\n-Goal is to answer 4 questions\n»What are the relevant characteristics of Customer domain?\n»What will the software product accomplish?\n»What features and functions will be used to accomplish it?\n»What constraints will be placed on the system?\n-Requirements are determined Iteratively during Inception and Elaboration Phases\n-Software team must learn enough to establish project scope, set an Iterative and Incremental project plan, and develop Use Cases recognizable to End-users"}, {"q": "The ERD MODEL is a/an _____________ MODEL.\nTesting Workflow\nAnalysis Workflow\nPlanning Workflow\nRequirements Workflow", "a": "ANALYSIS WORKFLOW"}, {"q": "Is the Analysis Workflow about HOW?\nTRUE\nFALSE", "a": "FALSE\nAnalysis model (the WHAT) into a Design OO Model (the HOW \"blue print\""}, {"q": "The initial UML USE CASE MODEL is created during the ______________ Phase.\nConstruction Phase\nInception Phase\nElaboration Phase\nTransition Phase", "a": "INCEPTION"}, {"q": "Which is not an UML MODEL?\nCLASS MODEL\nSEQUENCE MODEL\nERD MODEL\nUSE CASE MODEL", "a": "ERD MODEL is not an UML MODEL. ERD is used for Data Analysis."}, {"q": "Which one is not part of the ERD MODEL?\nClass\nRelationship\nAtribute\nEntity", "a": "Class"}, {"q": "Which is not part of the UML CLASS MODEL?\nmethod\nActor\nattribute\nClass", "a": "Actor\nUML CLASS MODEL uses 3 symbols: Rectangle for Class, Oval for attribute, and Line for method."}, {"q": "Which 2 are symbols for UML USE CASE MODEL?\nUse Case\nActor\nattribute\nClass", "a": "Actor and Use Case\nUML USE CASE uses only 2 symbols: Stick figure for Actor and Oval for Use Case."}, {"q": "The \"templates\" for UML USE CASE & MVC CLASS MODELS are in CANVAS under the TUTORIALS/TUTORIAL 1 on UML MODELING folder.\n\nTrue\nFalse", "a": "True"}, {"q": "The \"template\" for ERD MODEL is in CANVAS under the TUTORIALS/TUTORIAL 1 on ERD MODELING folder.\n\nTrue\nFalse", "a": "True"}, {"q": "What is the maximum number of items that can be sent to the server?", "a": "5"}, {"q": "If the user clicks submit without changing anything in the form, how many items will be sent to the server?", "a": "2"}, {"q": "Separation of concerns is the design principle of breaking up web content using distinct languages and documents that overlap as little as possible. In modern web design, document structure and text, visual layout, and page interaction are separately specified using three key languages.\n______ is the language that describes the page content.", "a": "HTML"}, {"q": "Refer to the associative array below.\n\nvar students = { 123: { name: \"Tiara\", gpa: 3.3 }, 444: { name: \"Lee\", gpa: 2.0 }, 987: { name: \"Braden\", gpa: 3.1 } };\n\nWhat number is output to the console?\ndelete students[\"Braden\"]; console.log(Object.keys(students).length);", "a": "3"}, {"q": "What is the value of s.length?\nvar s = \"\";", "a": "0"}, {"q": "Enter the value assigned to x in each code segment.\n\nvar quote = \"I am Spartacus!\";\n\nx = quote.indexOf(\"part\");", "a": "6\n\"part\" begins at index 6."}, {"q": "A web browser will process the HTML following a script element that uses an external JavaScript file while the browser waits for the web server to return the JavaScript file.\nFalse\nTrue", "a": "False\nA web browser will wait for a script element's external file to load before continuing to process the HTML. As a result, many web developers place their scripts at the end of the HTML"}, {"q": "The actions a web browser notices are called handlers.\nTrue\nFalse", "a": "False\nThe actions are called events and the code that executes in response to those events are called handlers."}, {"q": "ThoughWorks tool presented in the paper is used to estimate ______ projects.", "a": "Agile"}, {"q": "CONTINUE: A front-end developer is a developer that is proficient in client-side technologies. A back-end developer is a developer that is proficient in server-side technologies. Many developers strive to be proficient in both front-end and back-end technologies and how the two sides work together. A full-stack developer is a developer who has expertise in all aspects of a website or web application's development, including client technologies, server technologies, data modeling, and user interfaces. The \"stack\" in \"full-stack\" refers to the various layers that compose websites and web applications. Technology stacks have increased in complexity over the years, so even \"full-stack\" developers typically specialize in a few areas of the technology stack.", "a": "TRUE"}, {"q": "Business logic\n\nIssues regarding network throughput, cloud storage, virtualization, hardware constraints, multithreading, and data redundancy.\nRepresenting, storing, and retrieving application data in relational and non-relational databases.\nProgramming logic on the front or back-end that determines how data can be created, displayed, stored, and changed.\nProgrammable actions that may be performed on the underlying data. Often used by the front-end to interact with the back-end.\nVisual part of the application that users interacts with.\nAutomated tests that verify the web application components are working properly, independently and together.\nDevelopers need solid programming skills and the ability to use frameworks and libraries to simplify common tasks.", "a": "Programming logic on the front or back-end that determines how data can be created, displayed, stored, and changed."}, {"q": "User interface (UI)\n\nIssues regarding network throughput, cloud storage, virtualization, hardware constraints, multithreading, and data redundancy.\nRepresenting, storing, and retrieving application data in relational and non-relational databases.\nProgramming logic on the front or back-end that determines how data can be created, displayed, stored, and changed.\nProgrammable actions that may be performed on the underlying data. Often used by the front-end to interact with the back-end.\nVisual part of the application that users interacts with.\nAutomated tests that verify the web application components are working properly, independently and together.\nDevelopers are often aided by graphic designers and usability experts to create effective UIs, but developers need mastery of front-end technologies to implement UI designs.", "a": "Visual part of the application that users interacts with."}, {"q": "In the paper \"Why Software Projects Fail\", 48% of developers identified ___________ as the top reason for project failure.\n\nHINT: More than one answer might be correct. Please check each correct answer.\n- changing requirements\n- poorly documented requirements\n- customer not present during the requirements elicitation\n- changing and/or poorly documented requirements", "a": "- changing requirements\n- poorly documented requirements\n- changing and/or poorly documented requirements\n+ As part of the Developer Insights Report: A Global Survey of Today's DeveloperLinks to an external site., 48% of developers identified \"changing and/or poorly documented requirements\" as the top reason for project failure."}, {"q": "In the paper \"Why Software Projects Fail\", it is stated that an early criticism of agile processes was that it _____ .\n- it did not include the client\n- it did not use TDD\n- avoided the problem of poorly defined requirements by simply not seeking it.", "a": "- avoided the problem of poorly defined requirements by simply not seeking it.\n+ An early criticism of agile approaches was that it avoided the problem of poorly defined requirements by simply not seeking it. In other words, by integrating the target user into the software development team, validating intermediate and partial versions of the software solution with users often, and iterating rapidly with software changes to adapt to user feedback, the entire requirements definition phase can be avoided"}, {"q": "In the paper \"Why Software Projects Fail\", talks about keeping sizes of teams working on a single software component small following the _____ rule: a team should be no larger than can be fed by two ______).\n\nHINT: More than one answer might be correct. Please check each correct answer.\n- coupling\n- 2-pizza\n- cohesion\n- pizzas", "a": "- 2-pizza\n- pizzas\n+ New focus on keeping sizes of teams working on a single software component small (e.g. the 2-pizza rule: a team should be no larger than can be fed by two pizzas) is also an important organizational improvement and has done a great deal to limit broad organizational dysfunction in software development. In fact, in our survey, 60% of developers reported that they work in teams of 5 or less people."}, {"q": "PHP code runs in a web browser.\nTrue\nFalse", "a": "False"}, {"q": "Many PHP applications run on Linux with an Apache web server and MySQL as the database.\nTrue\nFalse", "a": "True"}, {"q": "What file extension does a PHP script have?\n.html\n.php\n.png", "a": ".php"}, {"q": "What does the code output?$test = \"adios\";echo \"$test test\";\n\n\n$test test\n$adios test\nadios test", "a": "adios test"}, {"q": "What default object is used when no object prefix appears before a property or method call? Ex: alert(\"Hello\");", "a": "window"}, {"q": "Which <script> attribute causes the browser to process the JavaScript after the webpage is completely loaded?", "a": "defer"}, {"q": "How many DOM nodes are created from the paragraph?\n<p>Feed the dog.<\/p>", "a": "One for the p element and one for the paragraph text"}, {"q": "What will o indicate emp_id is the primary key in a CREATE TABLE statement?\n\nCREATE TABLE employee (\n emp_id INTEGER,\n name VARCHAR(50),\n start_date DATE,\n PRIMARY KEY(emp_id)\n);", "a": "emp_id INTEGER PRIMARY KEY"}, {"q": "Given the employee table described below, if a salary_history table is created that contains the salaries of each employee for every year of their employment, what FOREIGN KEY declaration needs to be part of the salary_history table?\n\nCREATE TABLE employee (\n emp_id INTEGER,\n name VARCHAR(50),\n start_date DATE,\n PRIMARY KEY(emp_id)\n);", "a": "FOREIGN KEY(emp_id) REFERENCES employee(emp_id)"}, {"q": "The INSERT statement needs to specify column names unless _____.", "a": "the values are inserted in the same order as the table's columns"}, {"q": "What is the proper syntax to add a row to the employee table with the following columns?\n\nemp_id INTEGER AUTO_INCREMENT, first_name VARCHAR(50), last_name VARCHAR(50)", "a": "INSERT INTO employee (first_name, last_name)\nVALUES (' Jane', 'Doe' );"}, {"q": "What is the proper syntax to retrieve all columns from the employee table, with columns: emp_id, first_name, last_name, start_date?", "a": "SELECT *\nFROM employee;"}, {"q": "What is the proper syntax to retrieve the emp_id field of employees whose last name starts with 'A'?", "a": "SELECT emp_ id\nFROM employee\nWHERE last_name LIKE BINARY 'A%';"}, {"q": "What is the proper syntax to retrieve only the first and last names of employees whose start date is after March 1, 2020, ordered alphabetically by their last name, then first name?", "a": "SELECT first_name, last _name\nFROM employee\nWHERE start_date > '2020-03-01'\nORDER BY last name, first_ name;"}, {"q": "What is the result of this SELECT statement?\n\nSELECT MIN(salary)\nFROM employee;", "a": "Lowest salary of any employee"}, {"q": "What is the result of this SELECT statement?\n\nSELECT CONCAT(last_name, ', ', SUBSTRING(first_name, 1, 1))\nFROM employee;", "a": "Last name followed by a comma and the first initial"}, {"q": "The most common type of join for two tables is a(n) _____ join.", "a": "inner"}, {"q": "The product table has columns: product_id, name, price, with one row for each product_id. The inventory table has columns: product_id, color, quantity, with multiple rows for each product_id. Which SELECT statement returns all product names, with colors and quantities if the product exists in the inventory table, and NULL values otherwise?", "a": "SELECT name, color, quantity\nFROM product\nLEFT OUTER JOIN inventory\nON product-product_id = inventory.product_id;"}, {"q": "Refer to the product table. Which statement updates the lamp's price to 60, and the name to \"arc lamp\"?\n\nproduct_id name price\n111 chair 15\n222 lamp 40\n333 desk 75", "a": "UPDATE product\nSET price = 60, name = 'arc lamp'\nWHERE product_id = 222;"}, {"q": "Refer to the product table. How many rows are left in the product table after the following statement executes?\n\nproduct_id name price\n111 chair 15\n222 lamp 40\n333 desk 75\n\n\nDELETE FROM product\nWHERE price < 50;", "a": "1"}, {"q": "What is missing from the following PHP script to print the name on the webpage?\n\n<!DOCTYPE html>\n<html> \n <title>Hello PHP<\/title>\n <body> \n <?php \n $name = \"PHP\";\n echo \"<h1>Hello, _____!<\/h1>\";\n ?> \n <\/body>\n<\/html>", "a": "$name"}, {"q": "Which is a valid PHP variable name?", "a": "$first_name"}, {"q": "$y = 7 + \"3\" * 2 - 2", "a": "11"}, {"q": "What value is $x?\n\n$x = 12 <=> 10;", "a": "1"}, {"q": "What value is $x assigned with?\n\nif (\"he\" > \"hello\") {\n $x = 1;\n}\nelseif (\"he\" <= \"hello\") {\n $x = 2;\n}\nelse {\n $x = 0;\n}", "a": "2"}, {"q": "What value is $x assigned with?\n\n$value = \"Hello\";\n switch ($value) {\n case \"Hello\":\n $x = \"Hello\";\n case \"cheese\":\n $x .= \"Hi\";\n break;\n default: \n $x = \"Default\";\n}", "a": "HelloHi"}, {"q": "How many times does the while loop execute the loop body?\n\n$c = 0; \nwhile ($c < 2) {\n ec  {"q": "What happens if myfile.txt does not exist?", "a": "fopen(\"myfile.txt\", \"r\") returns FALSE"}, {"q": "When using the file upload widget, the uploaded file is placed in _____ on the web server.", "a": "a temporary directory"}, {"q": "$_FILES[\"userfile\"][\"error\"] will be _____ if a submitted file is uploaded to the web server successfully.", "a": "UPLOAD_ERR_OK"}, {"q": "A cookie is stored in the _____.", "a": "web browser"}, {"q": "The session_start() function _____.", "a": "looks for a cookie that contains the session ID"}, {"q": "Which line of code inserts a new row into table \"devices\" with the following columns: devId INTEGER, devType CHARACTER(10), devName VARCHAR(45)?", "a": "INSERT INTO devices\nVALUES (\n 123,\n 'Tablet',\n 'Apple iPad Pro'\n);"}, {"q": "Referring to the movie table, which UPDATE statement changes the movie title from 'Star Wars' to 'Elf'?\n\nmovId title year rating\n111 Singin' in the Rain 1952 G\n158 Star Wars 1977 PG\n209 The Dark Knight 2008 PG-13\n387 The Lord of the Rings 2001 PG-13\n654 Back to the Future 1985 PG", "a": "UPDATE movie\nSET title = 'Elf'\nWHERE title = 'Star Wars';"}, {"q": "The mysql command-line tool is used to _____.", "a": "perform administrative functions in MySQL server"}, {"q": "What MySQL error code is returned when the following SQL statement attempts to insert into the table \"devices\" with the following columns: devId INTEGER, devType CHARACTER(10), devName VARCHAR(45)?\n\nINSERT INTO devices (deviceId, name) VALUES (789, 'HP Pavilion');", "a": "1054: Unknown column name"}, {"q": "What does the mysqli method query() do if $sql is an improperly formatted INSERT statement?\n\n$mysqli->query($sql);", "a": "Throws an exception"}, {"q": "What does the code segment output?\n\n$sql = \"UPDATE inventory SET quantity = quantity - 1 WHERE itemName = 'chair'\";\n$mysqli->query($sql);\necho $mysqli->affected_rows;", "a": "Number of rows that were updated"}, {"q": "Compare and contrast MySQLi Improved Extension (MySQLi) with PHP Data Objects (PDO).", "a": "PDO supports many RDBMS's, and MySQLi only supports MySQL"}, {"q": "Fill in the blanks of the prepared statement to retrieve items from the inventory table with quantity of more than one, using parameters.\n\n$sql = \"SELECT itemName, quantity FROM inventory WHERE _____\"; \n$result = $pdo->prepare($sql);\n$result->execute(_____);", "a": "quantity > ?, [1]"}, {"q": "In cookie based authentication, after receiving a session cookie, the _____ needs to send the session cookie to the _____, as proof of successful authentication.", "a": "client, server"}, {"q": "How can a PHP script redirect the browser to another PHP script?", "a": "header(\"Location: script.php\");"}, {"q": "What does the PHP below output?\n\n$hash1 = password_hash(\"Qwerty\", PASSWORD_BCRYPT);\n$hash2 = password_hash(\"Qwerty\", PASSWORD_BCRYPT);\nif ($hash1 == $hash2) {\n echo \"true\";\n}\nelse {\n echo \"false\";\n}\nif (password_verify(\"qwerty\", $hash1)) {\n echo \"yes\";\n}\nelse {\n echo \"no\";\n}", "a": "false, no"}, {"q": "Why is a key sometimes needed to access a third-party web API?", "a": "To obtain a key, a developer must agree to restrictions on data received."}, {"q": "Which line of code adds 2 classes, \"first\" and \"last\", to the elements with ID \"section\"?", "a": "$(\"#section\").addClass(\"first last\");"}, {"q": "Which jQuery selector type is $(\"li:last\")?", "a": "Basic filter selector"}, {"q": "Which statement registers an event handler doThis() that is called when the mouse double-clicks on the selected button?", "a": "$(\"button\").on(\"dblclick\", doThis);"}, {"q": "What is the shortened version of $(document).ready(displayMessage);?", "a": "$(displayMessage);"}, {"q": "The JavaScript code contains a function convertPrice(), which converts the price from one currency to another. What is the correct way to call convertPrice() when the amount field is changed?", "a": "$(\"#amount\").on(\"change\", convertPrice);"}, {"q": "Which line of code adds the property to center the text for <h2> elements?", "a": "$(\"h2\").css(\"text-align\", \"center\");"}, {"q": "What does the queue() method accomplish?", "a": "Enables a non-animation method to run after an animation method completes"}, {"q": "What is the h1 element's style attribute after $(\"h1\").attr(\"style\", \"color:blue\"); is executed?\n\n<h1 style=\"text-align:center; color:red\">", "a": "color:blue"}, {"q": "Add a new DOM node to <div class=\"greeting\">Hello <\/div> to display \"Hello students\".", "a": "$(\"greeting\").append(\"students\");"}, {"q": "What makes JSON a preferred way to transport Ajax data?", "a": "JSON data is parsed automatically"}, {"q": "Which HTTP response code requires a custom error handling process instead of the fail() callback method?", "a": "200 OK with error message"}, {"q": "What type of data can be expected from a third party RESTful web API?", "a": "JSON or XML"}, {"q": "JSON with Padding (JSONP) dynamically injects _____ elements into a web page.", "a": "<script>"}, {"q": "In the following delete click event handler to delete a song, when is the done() method called?\n\n$(\"#deleteBtn\").click(function() {\n $.ajax({\n type: \"DELETE\",\n url: \"/api/songs/123\"\n }).done(function(data) {\n getAllSongs();\n }).fail(function(jqXHR) {\n $(\"#error\").html(\"The song could not be deleted.\");\n });\n});", "a": "After the song is deleted"}, {"q": "To use a jQuery plugin, the _____ must be downloaded to the browser.", "a": "plugin library"}, {"q": "The jQuery UI plugin requires an additional _____ in order to work.", "a": "external style sheet"}, {"q": "A _____ is a collection of _____ that focus on a related set of tasks.", "a": "library, functions"}, {"q": "What can replace \"jQuery()\" in a function call?", "a": "$()"}];
const list = document.getElementById('list');
const input = document.getElementById('q');
const clr = document.getElementById('clr');
const countEl = document.getElementById('count');
const toast = document.getElementById('toast');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hl(text, tokens){
  let out = esc(text);
  tokens.forEach(t=>{
    if(!t) return;
    try{ out = out.replace(new RegExp('('+escRe(esc(t))+')','ig'), '<mark>$1</mark>'); }catch(e){}
  });
  return out;
}
function score(it, tokens){
  const q = it.q.toLowerCase(), a = it.a.toLowerCase();
  let s = 0;
  for(const t of tokens){
    const inQ = q.split(t).length - 1;
    const inA = a.split(t).length - 1;
    if(inQ + inA === 0) return -1;
    s += inQ*6 + inA*2;
    if(q.startsWith(t)) s += 5;
    if(new RegExp('(^|[^a-z0-9])'+escRe(t)).test(q)) s += 3;
  }
  s -= it.q.length * 0.001;
  return s;
}
function render(){
  const raw = input.value.trim().toLowerCase();
  const tokens = raw.split(/\s+/).filter(Boolean);
  clr.style.display = raw ? 'block' : 'none';
  let items = DATA.map((it,i)=>({it,i,s: tokens.length?score(it,tokens):0}));
  if(tokens.length){ items = items.filter(x=>x.s>=0).sort((a,b)=> b.s-a.s || a.i-b.i); }
  countEl.textContent = tokens.length
     ? (items.length + (items.length===1?' result':' results'))
     : (DATA.length + ' cards — type to filter');
  if(!tokens.length){
    list.innerHTML = items.map(({it})=>cardHTML(it,[])).join('');
    return;
  }
  if(!items.length){
    list.innerHTML = '<div class="empty">No matching cards.<br>Try a different word.</div>';
    return;
  }
  list.innerHTML = items.map(({it})=>cardHTML(it,tokens)).join('');
}
function cardHTML(it,tokens){
  return '<article class="card"><div class="q">'+hl(it.q,tokens)+'</div><div class="a">'+hl(it.a,tokens)+'</div></article>';
}
function copyCard(el){
  const q = el.querySelector('.q').innerText;
  const a = el.querySelector('.a').innerText.replace(/^✓\s*/,'');
  const txt = q + '\n→ ' + a;
  (navigator.clipboard? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(showToast).catch(()=>{ 
      const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');showToast();}catch(e){} ta.remove();
    });
}
let tt;
function showToast(){ toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('show'),1000); }
list.addEventListener('click', e=>{ const c=e.target.closest('.card'); if(c) copyCard(c); });
input.addEventListener('input', render);
clr.addEventListener('click', ()=>{ input.value=''; input.focus(); render(); });
const _h = decodeURIComponent(location.hash.slice(1)||'').trim();
if(_h){ input.value = _h; }
render();
</script>
